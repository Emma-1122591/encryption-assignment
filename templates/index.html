<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"> 
    <title>Encryptie opdracht</title>
</head>
<body>
    <div>
        <section>
            <h1>Symmetrische encryptie!</h1>
            <p>Deze webapp krijgt een functie voor de symmetrische encryptie van tekst.</p>
        </section>
        <section>
            <h2>Encryptie</h2>
            <form method="post">
                <textarea id="text-input" name="text" type="textarea" placeholder="Voer hier de tekst in die je wilt versleutelen..."></textarea>
                <button id="encrypt-button" type="submit">Versleutelen!</button>
            </form>
        </section>
        {% if encrypted_text %}
        <section>
            <h2>Resultaat:</h2>
            <p>{{ encrypted_text }}</p>
        </section>
        {% endif %}
    </div>
</body>
</html>
